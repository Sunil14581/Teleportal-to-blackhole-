<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.U.N.I.L | Portal</title>
<style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; color: #fff; }
    .bg-frame { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; border:none; filter: brightness(45%); }
    
    .glass-tile { background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 25px; box-shadow: 0 0 25px rgba(255, 255, 255, 0.05); }
    
    /* Verification Box */
    #verifyOverlay { position: fixed; top:0; left:0; width:100%; height:100%; display: flex; justify-content: center; align-items: center; z-index: 1000; background: rgba(0,0,0,0.7); }
    .verify-box { width: 85%; max-width: 400px; text-align: center; border: 1px solid #fff; }
    input { width: 85%; padding: 12px; margin: 20px 0; background: rgba(255,255,255,0.1); border: 1px solid #fff; color: #fff; text-align: center; border-radius: 5px; }
    button { padding: 12px 25px; background: transparent; border: 1px solid #fff; color: #fff; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; }
    button:hover { background: #fff; color: #000; }

    /* Bio Console */
    #bioConsole { width: 85%; max-width: 850px; margin: 5vh auto; display: none; max-height: 85vh; overflow-y: auto; }
    .typing-text { font-size: 16px; line-height: 1.8; color: #e0e0e0; white-space: pre-wrap; }
    .cursor { display: inline-block; width: 10px; height: 20px; background: #fff; animation: blink 0.7s infinite; vertical-align: middle; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    
    #explorerBtn { position: fixed; bottom: 20px; right: 20px; display: none; }
    .nav-btn { padding: 10px 20px; background: rgba(0,0,0,0.8); border: 1px solid #fff; color: #fff; cursor: pointer; border-radius: 5px; }
</style>
</head>
<body>

<iframe class="bg-frame" src="https://eyes.nasa.gov/apps/solar-system/#/home?embed=true"></iframe>

<div id="verifyOverlay">
    <div class="glass-tile verify-box">
        <h3 style="letter-spacing:3px;">IDENTITY CHECK</h3>
        <p style="font-size:12px; color:#aaa;">[ ENTER ALIAS TO PROCEED ]</p>
        <input type="text" id="uName" placeholder="Your Name / Alias" autocomplete="off">
        <br>
        <button onclick="startMission()">Access Portal</button>
    </div>
</div>

<div id="bioConsole" class="glass-tile">
    <div style="text-align:center; border-bottom:1px solid #444; margin-bottom:20px; padding-bottom:15px;">
        <h1 style="letter-spacing:8px; margin:0;">{ S.U.N.I.L }</h1>
        <p style="font-size:11px; color:#888; margin:5px 0;">SINGULARITY • UNIVERSE • NUCLEUS • ION • LIFE</p>
    </div>
    <div id="typewriter" class="typing-text"></div><span class="cursor" id="cursor"></span>
</div>

<div id="explorerBtn">
    <button class="nav-btn" onclick="window.open('https://eyes.nasa.gov/apps/solar-system/#/home', '_blank')">Explore Universe 🪐</button>
</div>

<script>
    let finalBioText = "";
    let i = 0;

    function startMission() {
        const name = document.getElementById('uName').value;
        if(!name.trim()) { alert("IDENTIFY YOURSELF, TRAVELER!"); return; }
        
        // --- Random Lovely Greetings Set ---
        const greetings = [
            `[LOG-IN SUCCESSFUL]\nWelcome, ${name}! Your atoms were once part of the same star as mine. It's an honor to meet a fellow traveler of the cosmos. ✨`,
            `[ACCESS GRANTED]\nGreetings, ${name}! Out of all the galaxies and timelines, I'm glad our coordinates crossed today. 🌌`,
            `[PORTAL OPENED]\nHello, ${name}. Your presence adds a beautiful spark of curiosity to this entropy-driven universe. ⚛️`,
            `[CONNECTION STABLE]\nWelcome aboard, ${name}! Stationed on the 3rd rock from the sun, I've been waiting for a brilliant mind like yours. 🛰️`
        ];

        // Pick a random greeting
        const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];

        // --- Full Master Bio ---
        finalBioText = `${randomGreeting}\n\n[INITIALIZING MISSION DATA...]\n\n"Biology in my veins, Physics in my soul. 🧬⚛️"\nTime is relative, Curiosity is constant. ⏳\n\n$Me = Curiosity / Entropy$ 🌀\n\nAbsolute Zero > at {0 K}❄️ 🧊 Stay Cool.\n\n---\n[DECODING STARDUST LINEAGE...]\n\nHello, World. I am a localized collection of Atoms, traceable to an ancient Supernova that exploded billions of years ago. My existence is a statistical anomaly, optimized to understand the vastness of Space and the intricacy of Life.\n\nI am obsessed with the 95% of the universe we cannot see—Dark Matter and Dark Energy. My primary directive is to explore the 'Theory of Everything.'\n\nI view the world through a carbon-based lens, powered by complex chemical reactions. Every thought I have is a cascade of neural electricity, driven by the laws of Physics and Chemical Bonding. 🧬\n\nI am quantum entangled with the mysteries of Black Holes and the expansion of Spacetime. I am living in a constant state of quantum superposition—simultaneously fascinated by the DNA double helix and the spiral structure of a Galaxy. 🦠🌌\n\n[MISSION COMPLETE. LINK IS NOW LIVE]`;

        document.getElementById('verifyOverlay').style.display = 'none';
        document.getElementById('bioConsole').style.display = 'block';
        typeWriter();
    }

    function typeWriter() {
        if (i < finalBioText.length) {
            document.getElementById("typewriter").textContent += finalBioText.charAt(i);
            i++;
            // Smooth Scroll
            const consoleBox = document.getElementById('bioConsole');
            consoleBox.scrollTop = consoleBox.scrollHeight;
            setTimeout(typeWriter, 35);
        } else {
            document.getElementById('cursor').style.display = 'none';
            setTimeout(() => {
                document.getElementById('explorerBtn').style.display = 'block';
            }, 800);
        }
    }
</script>
</body>
</html>
