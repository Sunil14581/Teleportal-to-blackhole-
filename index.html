<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.U.N.I.L | Interstellar Portal</title>
    <style>
        /* CSS Variables for Consistency */
        :root {
            --hacker-green: #00ff00;
            --hacker-green-dim: rgba(0, 255, 0, 0.7);
            --text-white: #ffffff;
            --glass: rgba(0, 0, 0, 0.7);
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        
        /* 🌌 ANIMATED GALAXY BACKGROUND - NO EXTERNAL IMAGES */
        .deep-space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -100;
            background: radial-gradient(ellipse at 20% 50%, rgba(25, 0, 51, 0.8) 0%, rgba(0, 0, 0, 1) 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(0, 25, 51, 0.6) 0%, rgba(0, 0, 0, 1) 50%),
                        linear-gradient(135deg, #0a0e27 0%, #000000 100%);
            overflow: hidden;
        }

        /* Animated Stars */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            background: radial-gradient(circle, white, transparent);
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-20px) translateX(10px); }
        }

        /* Glassmorphic Tiles */
        .glass-tile { 
            position: relative;
            z-index: 10;
            background: var(--glass);
            border: 1px solid var(--border-glass); 
            border-radius: 12px; 
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.1); 
            backdrop-filter: blur(10px);
            animation: float 6s ease-in-out infinite;
        }
        
        /* Verification Overlay */
        #verifyOverlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }

        .verify-box { 
            width: 85%; 
            max-width: 400px; 
            text-align: center; 
            border: 2px solid var(--hacker-green); 
            padding: 40px; 
            background: rgba(0, 0, 0, 0.9);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .verify-box h2 {
            color: var(--hacker-green);
            font-size: 20px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--hacker-green);
        }

        .verify-box p {
            font-size: 11px;
            color: var(--hacker-green-dim);
            margin-bottom: 25px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        input { 
            width: 90%; 
            padding: 12px; 
            margin: 20px auto; 
            display: block;
            background: rgba(0, 255, 0, 0.05); 
            border: 1px solid var(--hacker-green); 
            color: var(--hacker-green); 
            text-align: center; 
            font-family: inherit;
            border-radius: 5px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            background: rgba(0, 255, 0, 0.1);
        }

        button { 
            padding: 12px 30px; 
            background: transparent; 
            border: 2px solid var(--hacker-green); 
            color: var(--hacker-green); 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-family: inherit;
            font-weight: bold;
            transition: all 0.3s;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
            margin-top: 10px;
        }

        button:hover { 
            background: var(--hacker-green); 
            color: #000; 
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.8);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Bio Console */
        #bioConsole { 
            width: 90%; 
            max-width: 900px; 
            margin: 5vh auto; 
            display: none; 
            max-height: 80vh; 
            overflow-y: auto; 
            padding: 40px; 
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .typing-text { 
            font-size: 14px; 
            line-height: 2; 
            color: var(--hacker-green); 
            white-space: pre-wrap; 
            word-wrap: break-word;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .cursor { 
            display: inline-block; 
            width: 10px; 
            height: 18px; 
            background: var(--hacker-green);
            margin-left: 3px;
            animation: blink 0.7s infinite;
            box-shadow: 0 0 10px var(--hacker-green);
        }

        @keyframes blink { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0; } 
        }
        
        /* Explorer Button */
        #explorerBtn { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            display: none; 
            z-index: 1100;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .nav-btn { 
            padding: 12px 20px; 
            background: rgba(0, 0, 0, 0.9); 
            border: 2px solid var(--hacker-green); 
            color: var(--hacker-green); 
            cursor: pointer; 
            border-radius: 5px; 
            font-family: inherit; 
            font-size: 12px; 
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            letter-spacing: 1px;
        }

        .nav-btn:hover {
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
            transform: scale(1.08);
            background: rgba(0, 255, 0, 0.1);
        }

        /* Custom Scrollbar */
        #bioConsole::-webkit-scrollbar { 
            width: 6px; 
        }

        #bioConsole::-webkit-scrollbar-track {
            background: rgba(0, 255, 0, 0.05);
        }

        #bioConsole::-webkit-scrollbar-thumb { 
            background: rgba(0, 255, 0, 0.3);
            border-radius: 3px;
        }

        #bioConsole::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 0, 0.6);
        }

        /* Header Styling */
        .console-header {
            text-align: center; 
            border-bottom: 2px solid var(--hacker-green); 
            margin-bottom: 30px; 
            padding-bottom: 20px;
        }

        .console-header h1 {
            letter-spacing: 8px; 
            margin: 0; 
            color: var(--hacker-green); 
            font-size: 32px;
            text-shadow: 0 0 20px var(--hacker-green);
        }

        .console-header p {
            font-size: 11px; 
            color: rgba(0, 255, 0, 0.6); 
            margin: 10px 0 0 0;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

<div class="deep-space-bg">
    <div class="stars" id="starsContainer"></div>
</div>

<div id="verifyOverlay">
    <div class="glass-tile verify-box">
        <h2>⚛️ IDENTITY CHECK ⚛️</h2>
        <p>[ CONNECTING TO LANIKEA NETWORK... ]</p>
        <input type="text" id="uName" placeholder="ENTER YOUR ALIAS" autocomplete="off">
        <button onclick="startMission()">Initialize Portal</button>
    </div>
</div>

<div id="bioConsole" class="glass-tile">
    <div class="console-header">
        <h1>{ S.U.N.I.L }</h1>
        <p>SINGULARITY • UNIVERSE • NUCLEUS • ION • LIFE</p>
    </div>
    <div id="typewriter" class="typing-text"></div><span class="cursor" id="cursor"></span>
</div>

<div id="explorerBtn">
    <button class="nav-btn" onclick="window.open('https://eyes.nasa.gov/apps/solar-system/#/home', '_blank')">🪐 Explore Universe</button>
</div>

<script>
    // Generate Random Stars
    function generateStars() {
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 2 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }
    }

    generateStars();

    let i = 0;
    let finalBioText = "";

    function startMission() {
        const name = document.getElementById('uName').value;
        if (!name.trim()) { 
            alert("[ ACCESS DENIED: IDENTIFY YOURSELF ]"); 
            return; 
        }
        
        const greetings = [
            `[CONNECTION SUCCESSFUL]\nWelcome, ${name}! Your atoms were once part of the same star as mine. It's an honor to meet a fellow traveler of the cosmos. ✨`,
            `[ACCESS GRANTED]\nGreetings, ${name}! Out of all the galaxies and timelines, I'm glad our coordinates crossed today. 🌌`,
            `[PORTAL OPENED]\nHello, ${name}. Your presence adds a beautiful spark of curiosity to this entropy-driven universe. ⚛️`,
            `[STABLE LINK]\nWelcome aboard, ${name}! Stationed on the 3rd rock from the G2V star, I've been waiting for a brilliant mind like yours. 🛰️`
        ];
        
        const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];

        finalBioText = `${randomGreeting}\n\n[INITIALIZING MISSION DATA...]\n\n"Biology in my veins, Physics in my soul." 🧬⚛️\nTime is relative, Curiosity is constant. ⏳⚛️\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n📡 ABOUT ME:\nI'm a curious mind lost in the cosmos of code and creativity. \nBy day: Problem solver. By night: Stargazer. Always: Dreamer.\n\n🔬 SKILLS:\n→ Web Development | JavaScript | Python\n→ Physics Enthusiast | Astronomy Nerd\n→ UI/UX Designer | Creative Thinker\n\n🌟 MISSION:\nTo bridge the gap between technology and imagination.\nTo build portals that connect minds across the universe.\n\n💫 CURRENT LOCATION:\nOrbiting the Interstellar Web\n\n🚀 NEXT DESTINATION:\nThe intersection of science and art.\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\nThanks for stopping by, ${name}.\nRemember: We are made of stardust. \nAct accordingly. 🌌\n\n[END TRANSMISSION]";

        document.getElementById('verifyOverlay').style.display = 'none';
        document.getElementById('bioConsole').style.display = 'block';
        typeWriter();
    }

    function typeWriter() {
        if (i < finalBioText.length) {
            document.getElementById("typewriter").textContent += finalBioText.charAt(i);
            i++;
            document.getElementById('bioConsole').scrollTop = document.getElementById('bioConsole').scrollHeight;
            setTimeout(typeWriter, 35);
        } else {
            document.getElementById('cursor').style.display = 'none';
            setTimeout(() => { 
                document.getElementById('explorerBtn').style.display = 'block'; 
            }, 800);
        }
    }

    // Allow Enter key to submit
    document.getElementById('uName').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') startMission();
    });
</script>

</body>
</html>
