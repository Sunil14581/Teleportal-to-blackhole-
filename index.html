<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.U.N.I.L | Interstellar Portal</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --dim-green: rgba(0, 255, 65, 0.2);
            --bg-black: #000800;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            height: 100%; 
            width: 100%;
            background-color: var(--bg-black);
            font-family: 'Courier New', Courier, monospace;
            color: var(--neon-green);
            overflow: hidden;
        }

        /* 🌌 DYNAMIC STARFIELD BACKGROUND */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at center, #001500 0%, #000000 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 🛡️ SECURITY OVERLAY */
        #verifyOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.9);
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .glass-panel {
            width: 85%;
            max-width: 400px;
            padding: 30px;
            background: rgba(0, 20, 0, 0.8);
            border: 1px solid var(--neon-green);
            border-radius: 15px;
            box-shadow: 0 0 20px var(--dim-green);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h2 { font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 10px; text-transform: uppercase; }
        .status-line { font-size: 0.7rem; color: var(--dim-green); margin-bottom: 25px; animation: blink 1.5s infinite; }

        input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            text-align: center;
            font-family: inherit;
            margin-bottom: 20px;
            border-radius: 5px;
            outline: none;
        }

        .btn {
            padding: 12px 30px;
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .btn:hover { background: var(--neon-green); color: black; box-shadow: 0 0 15px var(--neon-green); }

        /* 🛰️ BIO CONSOLE */
        #bioConsole {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 800px;
            margin: 4vh auto;
            height: 85vh;
            display: none; /* Initially hidden */
            flex-direction: column;
            background: rgba(0, 5, 0, 0.85);
            border: 1px solid var(--dim-green);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 40px rgba(0,0,0,1);
        }

        .console-header {
            text-align: center;
            border-bottom: 1px solid var(--dim-green);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .console-header h1 { font-size: 1.8rem; letter-spacing: 10px; color: white; }
        .console-header p { font-size: 0.6rem; letter-spacing: 2px; color: var(--neon-green); margin-top: 5px; opacity: 0.7; }

        #typewriter-container {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.8;
            padding-right: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-green) transparent;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--neon-green);
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* 🪐 NASA BUTTON */
        #explorerBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            display: none;
        }

        .nasa-btn {
            padding: 10px 15px;
            background: black;
            border: 1px solid white;
            color: white;
            font-size: 10px;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 5px;
        }

        /* SCROLLBAR */
        #typewriter-container::-webkit-scrollbar { width: 3px; }
        #typewriter-container::-webkit-scrollbar-thumb { background: var(--neon-green); }
    </style>
</head>
<body>

    <div id="starfield"></div>

    <div id="verifyOverlay">
        <div class="glass-panel">
            <h2>{ S.U.N.I.L }</h2>
            <p class="status-line">[ SECURE ACCESS TERMINAL ]</p>
            <input type="text" id="userInput" placeholder="ENTER ALIAS (NAME)" autocomplete="off">
            <button class="btn" onclick="startSequence()">Login</button>
        </div>
    </div>

    <div id="bioConsole">
        <div class="console-header">
            <h1>{ S.U.N.I.L }</h1>
            <p>SINGULARITY • UNIVERSE • NUCLEUS • ION • LIFE</p>
        </div>
        <div id="typewriter-container">
            <span id="output"></span><span class="cursor" id="cursor"></span>
        </div>
    </div>

    <div id="explorerBtn">
        <button class="nasa-btn" onclick="window.open('https://eyes.nasa.gov/apps/solar-system/#/home', '_blank')">Explore Space 🪐</button>
    </div>

<script>
    // 1. Create Starfield
    const field = document.getElementById('starfield');
    for (let i = 0; i < 120; i++) {
        let star = document.createElement('div');
        star.className = 'star';
        let size = Math.random() * 3;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
        field.appendChild(star);
    }

    // 2. Logic Control
    let i = 0;
    let bioText = "";
    const output = document.getElementById('output');
    const container = document.getElementById('typewriter-container');

    function startSequence() {
        const name = document.getElementById('userInput').value.trim();
        if (!name) { alert("[ ERROR: NAME REQUIRED ]"); return; }

        const greetings = [
            `[AUTH] Welcome, ${name}. Your atoms are ancient.`,
            `[AUTH] Greetings, ${name}. Coordinates locked.`,
            `[AUTH] Hello, ${name}. Entropy is stable.`
        ];
        
        const welcome = greetings[Math.floor(Math.random() * greetings.length)];

        bioText = `${welcome}\n\n[INITIALIZING DATA TRANSMISSION...]\n\n"Biology in my veins, Physics in my soul." 🧬⚛️\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\nMe = Curiosity / Entropy 🌀\nAbsolute Zero > at {0 K} ❄️\n\n[DECODING STARDUST LINEAGE...]\n\nI am a localized collection of Atoms, traceable to an ancient Supernova. My existence is a statistical anomaly, optimized to understand the vastness of Space.\n\nI am obsessed with the 95% invisible universe—Dark Matter and Energy. Every thought is a neural spark of electricity. 🧬\n\nI am quantum entangled with the mysteries of Black Holes. Simultaneously fascinated by DNA and Galaxies. 🦠🌌\n\n[END OF TRANSMISSION]\n[PORTAL FULLY ACTIVE]`;

        // Hide login, show console
        document.getElementById('verifyOverlay').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('verifyOverlay').style.display = 'none';
            document.getElementById('bioConsole').style.display = 'flex';
            typeWriter();
        }, 800);
    }

    function typeWriter() {
        if (i < bioText.length) {
            output.textContent += bioText.charAt(i);
            i++;
            container.scrollTop = container.scrollHeight;
            setTimeout(typeWriter, 30);
        } else {
            document.getElementById('cursor').style.display = 'none';
            document.getElementById('explorerBtn').style.display = 'block';
        }
    }

    // Enter key support
    document.getElementById('userInput').addEventListener('keyup', (e) => {
        if (e.key === 'Enter') startSequence();
    });
</script>

</body>
</html>
