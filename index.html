<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>S.U.N.I.L | Interstellar Portal v5.0</title>
<style>
    /* ⚛️ AESTHETIC MASTER VARIABLES */
    :root {
        --hacker-green: #00ff00;
        --text-white: #ffffff;
        --border-glass: rgba(255, 255, 255, 0.1);
        --scroll-thumb: rgba(0, 255, 0, 0.2);
    }

    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
    
    /* 🌌 DEEP SPACE BACKGROUND - Fixed & Static for Guaranteed Load */
    .deep-space-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -100;
        background: url('https://images.unsplash.com/photo-1543722530-d2c3201371e7?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
        background-size: cover;
        filter: brightness(45%);
    }

    /* 🛡️ SECURITY OVERLAY (LOGIN) */
    #verifyOverlay { position: fixed; top:0; left:0; width:100%; height:100%; display: flex; justify-content: center; align-items: center; z-index: 1000; background: rgba(0,0,0,0.6); }
    
    /* Highly Transparent iOS Tile */
    .glass-box { 
        position: relative;
        z-index: 10;
        background: rgba(255, 255, 255, 0.05); /* HIGHLY TRANSPARENT */
        border: 1px solid var(--border-glass); 
        border-radius: 12px; 
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.5); 
        backdrop-filter: blur(10px); /* ISO BLUR */
        padding: 30px;
        transition: opacity 0.5s ease;
    }

    .verify-box { width: 85%; max-width: 400px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.2); }
    input { width: 90%; padding: 12px; margin: 20px 0; background: rgba(255,255,255,0.05); border: 1px solid #fff; color: #fff; text-align: center; font-family: inherit; }
    button { padding: 12px 25px; background: transparent; border: 1px solid #fff; color: #fff; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-family: inherit; transition: 0.3s; }
    button:hover { background: #fff; color: #000; }

    /* 🛰️ MAIN BIO CONSOLE */
    #bioConsole { width: 90%; max-width: 900px; margin: 5vh auto; display: none; max-height: 80vh; overflow-y: auto; padding: 40px; }
    
    .console-header { text-align: center; border-bottom: 2px solid var(--hacker-green); margin-bottom: 25px; padding-bottom: 15px; }
    .console-header h1 { letter-spacing: 10px; margin: 0; color: #fff; font-size: 32px; }
    .console-header p { font-size: 11px; color: var(--hacker-green); margin: 5px 0 0 0; letter-spacing: 3px; }

    .typing-text { font-size: 15px; line-height: 1.8; color: var(--hacker-green); white-space: pre-wrap; }
    .cursor { display: inline-block; width: 8px; height: 18px; background: var(--hacker-green); animation: blink 0.7s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    
    /* Custom Scrollbar */
    #bioConsole::-webkit-scrollbar { width: 4px; }
    #bioConsole::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
    #bioConsole::-webkit-scrollbar-thumb:hover { background: rgba(0, 255, 0, 0.4); }
</style>
</head>
<body>

<div class="deep-space-bg"></div>

<div id="verifyOverlay">
    <div class="glass-box verify-box">
        <h2 style="letter-spacing:4px; margin:0; color:#fff;">IDENTITY CHECK</h2>
        <p style="font-size:10px; color:var(--hacker-green);">[ CONNECTING TO LANIKEA NETWORK... ]</p>
        <input type="text" id="uName" placeholder="ENTER YOUR ALIAS" autocomplete="off">
        <br>
        <button onclick="startMission()">Initialize Portal</button>
    </div>
</div>

<div id="bioConsole" class="glass-box">
    <div class="console-header">
        <h1>{ S.U.N.I.L }</h1>
        <p>SINGULARITY • UNIVERSE • NUCLEUS • ION • LIFE</p>
    </div>
    <div id="typewriter" class="typing-text"></div><span class="cursor" id="cursor"></span>
</div>

<script>
    let i = 0;
    let finalBioText = "";

    function startMission() {
        const name = document.getElementById('uName').value;
        if(!name.trim()) { alert("[ ACCESS DENIED: IDENTIFY YOURSELF ]"); return; }
        
        // --- Dynamic Randomized Greetings Protocol ---
        const greetings = [
            `[AUTH] Welcome, ${name}. Your atoms are traceable to an ancient Supernova. ✨`,
            `[AUTH] Greetings, ${name}. Our cosmic coordinates have finally aligned. 🌌`,
            `[AUTH] Hello, ${name}. Your curiosity is the only fight against entropy. ⚛️`
        ];
        const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];

        // --- POINT-WISE DECODED CONTENT ---
        finalBioText = `${randomGreeting}\n\n[INITIALIZING DATA TRANSMISSION...]\n\n"Biology in my veins, Physics in my soul. 🧬⚛️"\nTime is relative, Curiosity is constant. ⏳⚛️\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n$Me = Curiosity / Entropy$ 🌀\nAbsolute Zero > at {0 K}❄️ 🧊 Stay Cool.\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n📡 ABOUT ME:\n→ LOCALIZED COLLECTION OF ATOMS\n→ 95% OBSESSED WITH UNSEEN UNIVERSE\n→ (DARK MATTER & DARK ENERGY)\n\n🔬 SKILLS:\n→ WEB DEVELOPMENT | CODE | CREATIVITY\n→ PHYSICS ENTHUSIAST | ASTRONOMY NERD\n→ UI/UX DESIGNER | CREATIVE THINKER\n\n🌟 MISSION:\n→ EXPLORE 'THEORY OF EVERYTHING'\n→ UNITE QUANTUM WITH COSMIC\n→ SEE THE FIRST CELL & LAST STAR 🦠🌌\n\n💫 CURRENT LOCATION:\n→ ORBITING INTERSTELLAR WEB\n→ 3RD ROCK FROM G2V STAR\n\n🚀 NEXT DESTINATION:\n→ INTERSECTION OF SCIENCE & ART\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n[DECODE COMPLETE. PORTAL IS ACTIVE]\n\n👉 EXPLORE SPACE 🪐:\n→ [https://eyes.nasa.gov/apps/solar-system/#/home](https://eyes.nasa.gov/apps/solar-system/#/home)\n\n[END TRANSMISSION]`;

        document.getElementById('verifyOverlay').style.display = 'none';
        document.getElementById('bioConsole').style.display = 'block';
        typeWriter();
    }

    function typeWriter() {
        if (i < finalBioText.length) {
            document.getElementById("typewriter").textContent += finalBioText.charAt(i);
            i++;
            // Auto Scroll
            const consoleBox = document.getElementById('bioConsole');
            consoleBox.scrollTop = consoleBox.scrollHeight;
            setTimeout(typeWriter, 35);
        } else {
            document.getElementById('cursor').style.display = 'none';
        }
    }
</script>
</body>
</html>
